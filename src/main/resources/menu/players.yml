# Menu text is configured directly in this file.
title: "&8Suspects: {model}"
# Inventory slots; a multiple of 9 from 9 to 54.
size: 54

# Material names mapped to zero-based decorative slots.
decoration:
  LIGHT_BLUE_STAINED_GLASS_PANE: [ 0,1,2,3,4,5,6,7,8, 45,46,48,52,53 ]

settings:
  # Zero-based slots used for player entries.
  player_slots: [ 10,11,12,13,14,15,16, 19,20,21,22,23,24,25, 28,29,30,31,32,33,34, 37,38,39,40,41,42,43 ]
  # Appearance and click actions of each player entry.
  player_form:
    material: PLAYER_HEAD
    display_name: " &#36cbe9▶ &#F3F3F3{player_name} &#F3F3F3[{cheat_bar}&#F3F3F3] {avg_percent}%"
    lore:
      - ""
      - " &#c1dce7Recent checks:"
      - "{checks}"
      - ""
      - " &#c1dce7Average probability"
      - " &#e2c46eAVG: {avg}%"
      - ""
      - " &#c1dce7Last server:"
      - " &f{last_server}"
      - ""
      - " &#c1dce7Last hit:"
      - " &f{last_check}"
      - ""
      - " &#36cbe9▶ &#F3F3F3LEFT click &7to spectate"
      - " &#36cbe9▶ &#F3F3F3RIGHT click &7to view history"

    # [player] executes as the viewer; {player_name} is the selected player.
    # [open-history] opens the selected player's history.
    click_actions:
      left:
        - '[player] gm 3'
        - '[player] tp {player_name}'
      right:
        - '[open-history]'

  # Replacement for unavailable player values.
  empty_value: " &7—"
  # Text shown when no probability results are available.
  no_checks_message: " &7No data"

  # Filled and empty segments of the probability bar.
  bar_symbol: '■'
  empty_bar_symbol: '&8■'

  # Maximum rows of recent probability results.
  check_lines: 3
  # Results per row; check_lines * probs_per_line must not exceed 1000.
  probs_per_line: 7

# Navigation items. Slots are zero-based; actions select the previous or next page.
items:
  previous-item:
    material: ARROW
    action: 'previous_page'
    display_name: "&#36cbe9◀ &#F3F3F3Previous page"
    slot: 47
  next-item:
    material: ARROW
    action: 'next_page'
    display_name: "&#F3F3F3Next page &#36cbe9▶"
    slot: 51
  model-item:
    material: COMPARATOR
    action: 'switch_model'
    display_name: "&fModel: {model} &7(click to switch)"
    slot: 49
  refresh-item:
    material: CLOCK
    action: 'refresh'
    display_name: "&fRefresh"
    slot: 50
