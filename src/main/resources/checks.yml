analyze:
  # Master switch for all model detection and new inference requests.
  enabled: false
  # Written by /raveon connect <code>. Get the code on your server's page at raveon.wtf.
  api-key: ""
  # Inference endpoint. Changing this address requires a restart.
  server: https://api.raveon.wtf/v1/inference
  # Primary model, capture window, step and display names are loaded from the API
  # at startup, on profile updates and /raveon reload. Configure them on the website.

  models:
    pro:
      # Local switches can only narrow the models and roles allowed by the API.
      enabled: true
      actions:
        alert: true
        mitigate: true
        punish: true
      # Analysis period after an attack, in units of 50 ms.
      combat: 50
      mitigation-weight: 1.0
      buffer:
        # website: use the API buffer; local: use this entire block.
        # Without an API buffer, these values are the fallback in either mode.
        # Apply local edits with /raveon reload. This does not grant model access.
        source: website
        # "" = own buffer; "ultra" = share Ultra's buffer.
        # A shared buffer uses its owner's flag/reset/growth/decay and BOTH
        # probability thresholds. Disabled/unlicensed owners fall back to own buffer.
        # Chains and cycles are invalid.
        inherit: ""
        flag: 50.0
        reset: 25.0
        multiplier: 100.0
        decrease: 0.25
        threshold: 0.85
        legit-threshold: 0.1
        # Contribution of this answer source, including when sharing a buffer.
        weight: 1.0
        # Extra source weight when this model is primary; minimum 1.
        primary-multiplier: 2.0

    ultra:
      enabled: true
      actions:
        alert: true
        mitigate: true
        punish: true
      combat: 64
      mitigation-weight: 1.0
      buffer:
        # website = API values; local = this block. Apply with /raveon reload.
        source: website
        # "" = own buffer; "pro" = share Pro's buffer, using Pro's thresholds.
        inherit: ""
        flag: 50.0
        reset: 25.0
        multiplier: 100.0
        decrease: 0.25
        threshold: 0.85
        legit-threshold: 0.1
        weight: 1.0
        primary-multiplier: 2.0

  mitigation:
    # Reduce outgoing PvP melee damage using a score separate from punishment buffers.
    enabled: false
    # Probability that contributes zero to the score; must be strictly between 0 and 1.
    neutral-probability: 0.5
    # Seconds for the score to decay by half without new contributions.
    half-life-seconds: 30
    # Stop mitigation after this many seconds without participating model answers.
    max-silence-seconds: 10
    # Required answers from primary, or the first participating model if primary is excluded.
    min-answers: 3
    # Damage reduction starts above this score.
    activation-score: 3.0
    # Score that applies the maximum reduction; must exceed activation-score.
    full-effect-score: 10.0
    # Score cap; must be at least full-effect-score.
    max-score: 20.0
    # Maximum damage fraction removed; 0.5 means 50%, range: 0-1.
    max-damage-reduction: 0.5

  worldguard:
    # Apply region bypass rules when WorldGuard is available.
    enabled: true
    # World names mapped to region IDs where analysis is bypassed.
    disabled-regions:
      spawn:
        - "spawn"
    # World names mapped to region IDs that override the bypass.
    enabled-regions:
      spawn:
        - "pvp"
