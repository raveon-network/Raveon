history-no-data: "{prefix} &#F3F3F3No data found for &#F65943{player}&#F3F3F3."
menus:
  history:
    title: "&8{player_name}: history ({model})"
    snapshot:
      name: "&fCheck #{snapshot_number}"
      lore:
        - "&7Probability: {snapshot_avg}%"
        - "&7Time: &f{snapshot_last_update} ago"
    entry: "&7Probability: {chance}%\n&7Time: &f{time} ago"
    empty_entries: "&7No entries"
    empty_server: "—"
    model: "&fModel: {model} &7(click to switch)"
    refresh: "&fRefresh"
    previous: "&#36cbe9◀ &#F3F3F3Previous page"
    next: "&#F3F3F3Next page &#36cbe9▶"
    back: "&#36cbe9◀ &#F3F3F3Back"
