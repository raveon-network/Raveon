# Translations for en. Runtime placeholders use {name}.
history-header: "{prefix} &#F3F3F3Check history for &#F65943{player} &7({page}&8/&7{max_pages})"
history-entry: "{prefix} &8[&#93FFD7{server}&8] &#F3F3F3Failed &#93FFD7{check_name} &#F3F3F3(x&#F65943{vl}&f) &7{verbose} (&#93FFD7{time_ago} ago&7)"
