reload-failed: "{prefix} &cConfiguration was not reloaded: {error}"
connect:
  usage: "{prefix} &#F3F3F3Usage: &#CDCDCD/raveon connect <code>&#F3F3F3. Get the code on your server's page on the website."
  checking: "{prefix} &#F3F3F3Connecting to Raveon..."
