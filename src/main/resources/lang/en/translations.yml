# Translations for en. Runtime placeholders use {name}.
prefix: "&#4A92E2R&#509CE8a&#57A6EEv&#5DAFF3e&#64B9F9o&#6AC3FFn &7»"
alerts-enabled: "{prefix} &#F3F3F3Alerts &#95F643enabled&#F3F3F3!"
alerts-disabled: "{prefix} &#F3F3F3Alerts &#F65943disabled&#F3F3F3!"
ai-alert: "{prefix} &#F3F3F3Player &#CDCDCD{player}&#F3F3F3 failed &#F65943Aim (AI / {model}) &#DBDBDB[&#F65943x{vl}&#DBDBDB] &#CDCDCD{probability}%"
reloading: "{prefix} &#F3F3F3Reloading configuration..."
