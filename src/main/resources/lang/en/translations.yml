  usage: "{prefix} &#F3F3F3Usage: &#CDCDCD/raveon monitor chat [name] [pro|ultra|all] &8| &#CDCDCD/raveon monitor prob <name> [pro|ultra|all] &8| &#CDCDCD/raveon monitor stop"
