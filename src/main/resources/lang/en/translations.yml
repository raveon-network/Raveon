    enabled: "{prefix} &#F3F3F3Chat monitoring enabled for &#CDCDCD{player} &8[&f{model}&8]&f."
    switched: "{prefix} &#F3F3F3Chat monitoring switched to &#CDCDCD{player} &8[&f{model}&8]&f."
    disabled: "{prefix} &#F3F3F3Chat monitoring &#F65943disabled&#F3F3F3."
