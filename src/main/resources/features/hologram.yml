# Enable probability displays for players.
enable: true
# Vertical distance between floating lines, in blocks.
line_spacing: 0.28
# Floating display height relative to the player's position, in blocks.
offset: 2.7

model_rotation:
  # Ticks between model switches; 80 ticks = 4 seconds at 20 TPS. Range: 1-72000.
  # Only enabled models available to this server are shown.
  interval_ticks: 80
  # Display names inserted into {model}; colors are supported.
  names:
    pro: "Pro"
    ultra: "Ultra"

below_name:
  # Use the client's below-name slot for a single line; yield when another plugin owns it.
  # Two or more lines automatically use a floating hologram, which supports multiple lines.
  enable: true
  # Also show a floating hologram when the single below-name line is active.
  also_show_hologram: false

# Every entry is a separate hologram line, displayed in this order. Maximum: 32 lines.
# Configure all hologram text here. Colors (& and hex) and blank lines are supported.
# Tokens: {model}, {prob}, {avg}, {buffer}, {prob_color}, {probability_color}, {avg_color}.
# Add [{model}] wherever you want the selected model name to appear.
lines:
  - "&7[{model}] {prob_color}&l{prob}% &7| {avg_color}&l{avg}% &7| &f{buffer}"
