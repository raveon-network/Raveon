# Enable AI-probability display above/below players?
enable: true
line_spacing: 0.28
offset: 2.7
below_name:
  enable: true
  # If true, viewers whose client already gets below-name text also get the floating
  # hologram at the same time (both are shown together). Default: only one or the other.
  also_show_hologram: false

# {avg_color} - color matching the average value, {buffer} - current buffer.
# Below-name can only render a single line: only the first entry of this list is used for it.
lines:
  - '{prob_color}&l{prob}% &7| {avg_color}&l{avg}% &7| &f{buffer}'
