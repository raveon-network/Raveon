# Enable probability displays for players.
enable: true
# Vertical distance between floating lines, in blocks.
line_spacing: 0.28
# Floating display height relative to the player's position, in blocks.
offset: 2.7
below_name:
  # Use the client's single below-name slot; yield when another plugin owns it.
  enable: true
  # Also display floating lines when Raveon's below-name display is active.
  also_show_hologram: false

# Below-name text; only the first list entry is used.
# {lang:key} resolves a message from the selected language catalog.
lines:
  - "{lang:holograms.below_name}"

# Floating text for each model.
# Tokens: {prob}, {avg}, {buffer}, {prob_color}, {probability_color}, {avg_color}.
floating_lines:
  pro: "{lang:holograms.pro}"
  ultra: "{lang:holograms.ultra}"
