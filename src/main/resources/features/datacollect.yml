frames: 50
combat_timer: 50
clear_buffer_on_combat_timeout: true

auto_save:
  enable: true
  value: 50

info_statistic:
  # ACTIONBAR / BOSSBAR
  type: BOSSBAR
  line: "&7{player}&f collected: &7{frames_collecting}&f (buffer: &7{frames_size}&f) sent: &7{sending}"

messages:
  start:
    help: "&fUsage: &7/raveon datacollect start <collector> <cheat|legit> <dataset_name>"
    none_selected: "&fYou must specify a dataset name to start collecting"
    start: "&fStarted dataset collection for &7{target}"
  stop:
    help: "&fUsage: &7/raveon datacollect stop <collector>"
    no_collecting: "&fPlayer {target} is not currently collecting data"
    stop: "&fStopped dataset collection for &7{target}"
    auto_stop: "&fDataset collection automatically stopped for &7{target}"
  all:
    offline: "&fPlayer &7{target} &fis offline"
    already_collecting: "&fData is already being collected from &7{target}"
    none_type: "&fInvalid collection type. Available: &7[cheat/legit]"