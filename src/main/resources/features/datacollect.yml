# Pro frames per saved dataset batch; independent of the fixed inference window.
frames: 50
ultra:
  # Ultra frames per saved dataset batch.
  frames: 64
  # Collection period after an attack, in units of 50 ms.
  combat_timer: 64
# Pro collection period after an attack, in units of 50 ms.
combat_timer: 50
# Clear unsaved frame buffers when the combat period expires.
clear_buffer_on_combat_timeout: true

auto_save:
  # Stop collection automatically after the configured number of saved batches.
  enable: true
  # Saved batches per collection session before automatic stop.
  value: 50

info_statistic:
  # Collection progress display: ACTIONBAR or BOSSBAR.
  type: BOSSBAR
  line: "&7{player}&f collected: &7{frames_collecting}&f (buffer: &7{frames_size}&f) saved: &7{sending}"

messages:
  start:
    help: "&fUsage: &7/raveon datacollect start <player> <cheat|legit> <dataset_name>"
    none_selected: "&fSpecify a dataset name to start collecting."
    start: "&fStarted dataset collection for &7{target}&f."
    pending: "&cThe previous dataset is still being saved or has unsaved frames. Run stop again first."
  stop:
    help: "&fUsage: &7/raveon datacollect stop <player>"
    no_collecting: "&fPlayer &7{target} &fis not collecting data."
    stop: "&fStopped dataset collection for &7{target}&f."
    auto_stop: "&fDataset collection automatically stopped for &7{target}&f."
    failed: "&cDataset save failed. Unsaved frames were retained; run stop again to retry."
  all:
    offline: "&fPlayer &7{target} &fis offline."
    already_collecting: "&fData is already being collected from &7{target}&f."
    none_type: "&fInvalid collection type. Available: &7cheat / legit"
