name: Build

on:
  push:
    branches: [ "**" ]
  pull_request: { }

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build with Gradle
        run: gradle build

      - name: Create / Update Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "Latest"
          body: "Автоматическая сборка для коммита ${{ github.sha }}"
          prerelease: false
          files: |
            build/libs/*.jar
            !build/libs/*-all.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
