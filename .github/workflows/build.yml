name: Build

on:
  push:
    branches: [ "**" ]
  pull_request: { }
  workflow_dispatch: { }

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build with Gradle
        run: gradle build

      - name: Extract version and JAR
        id: get_version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          jars = []
          for jar in Path("build/libs").glob("*.jar"):
              if jar.name.endswith(("-all.jar", "-sources.jar", "-javadoc.jar")):
                  continue
              match = re.fullmatch(r"Raveon-(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)\.jar", jar.name)
              if match:
                  jars.append((jar, match.group(1)))
          if len(jars) != 1:
              raise SystemExit(f"Expected exactly one Raveon release JAR, found {len(jars)}")
          jar, version = jars[0]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\njar={jar.as_posix()}\n")
          PY

      - name: Create / Update Release
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/1.0' || github.ref == 'refs/heads/2.0')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.get_version.outputs.version }}"
          name: "v${{ steps.get_version.outputs.version }}"
          target_commitish: ${{ github.sha }}
          body: "Automated build from ${{ github.ref_name }} at commit ${{ github.sha }}"
          prerelease: false
          make_latest: ${{ github.ref == 'refs/heads/2.0' && 'true' || 'false' }}
          fail_on_unmatched_files: true
          files: ${{ steps.get_version.outputs.jar }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
